<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="game.css">
    </head>
    <body>
        <p class="heading">Let's Play</p>
        <button class="move-button" onclick ="
            playGame('rock');"><img src="images/rock-emoji.png" class="move-icon"></button>
        <button class="move-button" onclick="
             playGame('paper');">
            <img src="images/paper-emoji.png" class="move-icon"></button>
        <button class="move-button" onclick="
             playGame('scissors');"><img src="images/scissors-emoji.png" class="move-icon"></button>
    </body>
    <p class="moves"></p>
    <p class ="display-result"></p>
    <p class="show-score"></p>
    <button class="reset-button" onclick="
    score ={
        Wins: 0,
        Losses:0,
        Tie:0
    };
    updateScore();">Reset Score</button>

    <script src="game.js"></script>
</html>
