<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="game.css">
    </head>
    <body>
        <p class="heading">Let's Play</p>
        <button class="move-button rock-btn">
            <img src="images/rock-emoji.png" class="move-icon"></button>
        <button class="move-button paper-btn"\>
            <img src="images/paper-emoji.png" class="move-icon"></button>
        <button class="move-button scissors-btn">
            <img src="images/scissors-emoji.png" class="move-icon"></button>
    </body>
    <p class="moves"></p>

    score ={
        Wins: 0,
        Losses:0,
        Tie:0
    };
  
        localStorage.removeItem('score');
          updateScore();">Reset Score</button>

        autoPlay();">Auto Play</button>

    <script src="game.js"></script>
</html>
